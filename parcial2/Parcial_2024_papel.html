<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#dde1e7;--ok:#127a3e;--okbg:#e7f6ec;--no:#b42318;--nobg:#fdecea;--ac:#2453a6;--warn:#8a5a00;--warnbg:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e6e9ef;--mut:#98a2b3;--bd:#2c3340;--ok:#4cc27a;--okbg:#15301f;--no:#f07167;--nobg:#3a1c1a;--ac:#7aa2f7;--warn:#f2c14e;--warnbg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px}
h1{font-size:17px;margin:0 0 8px}
.barra{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.prog{font-size:13px;color:var(--mut);margin-left:auto}
main{max-width:820px;margin:0 auto;padding:12px 16px 60px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.cab{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut);margin-bottom:6px}
.selo{border:1px solid var(--bd);border-radius:999px;padding:1px 8px}
.selo.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.stem{font-weight:600;margin-bottom:10px}
.op{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 11px;border-radius:9px;font-size:15px}
.op b{margin-right:6px}
.linha{display:flex;gap:6px;align-items:stretch;margin:6px 0}
.linha .op{margin:0;flex:1}
.risca{flex:none;width:40px;padding:0;font-size:16px;font-weight:700;color:var(--mut)}
.risca.on{background:var(--no);border-color:var(--no);color:#fff}
.op.riscada{opacity:.45;text-decoration:line-through}
.bloco-btn{border-color:var(--no);color:var(--no);font-weight:600}
.bloco-cab{background:var(--nobg);border:1px solid var(--no);border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px}
.bloco-fim{margin-top:6px;font-weight:600}
.op.ok{background:var(--okbg);border-color:var(--ok)}
.op.no{background:var(--nobg);border-color:var(--no)}
.nota{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.op.ok .nota{color:var(--ok)}
.clave{margin-top:10px;font-size:14px;border-left:3px solid var(--ok);padding:4px 10px}
.slide img{max-width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--bd)}
.acoes{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.vazio{color:var(--mut);text-align:center;padding:30px}
</style><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b2029" media="(prefers-color-scheme: dark)">
<style>
button,.op,.risca{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

 body{font-size:16px;-webkit-text-size-adjust:100%}

 h1{font-size:13px;margin:0 12px 4px;line-height:1.25;color:var(--mut);font-weight:600}

 .barra::-webkit-scrollbar{display:none}
 .barra button{flex:none;white-space:nowrap;padding:8px 12px}
 #modos{flex-wrap:wrap;overflow:visible;gap:6px}
 #modos button{flex:1 1 auto;padding:8px 6px;font-size:14px}

 #filtros button{padding:6px 10px;font-size:14px}
 main{padding:4px 8px calc(84px + env(safe-area-inset-bottom))}
 .q{padding:10px 10px;margin:6px 0;border-radius:10px}
 .cab{margin-bottom:4px}
 .stem{font-size:16px;line-height:1.35;margin-bottom:8px}
 .op{font-size:15px;line-height:1.35;padding:9px 10px}
 .linha{gap:5px;margin:5px 0}
 .risca{width:38px;font-size:16px}
 body.umpor #lista>.q{display:none}
 body.umpor #lista>.q.atual{display:block}
 #navcel{display:none}
 body.umpor #navcel{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;gap:8px;align-items:center;
  background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
 #navcel button{padding:14px 10px;font-size:16px}
 body.umpor:not(.menu) header{display:none}
 body.umpor main{padding-top:calc(6px + env(safe-area-inset-top))}
 body.umpor.menu #navMenu{background:var(--ac);border-color:var(--ac);color:#fff}
 #navcel #navMenu{flex:0 0 64px;font-size:14px;padding:14px 4px}
 #navcel #navAnt{flex:0 0 52px}
 #navcel #navSig{flex:1;background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
 #navcel #navNum{flex:none;min-width:64px;text-align:center;font-size:14px;color:var(--mut)}
 #navcel button:disabled{opacity:.35}
 .nota{font-size:14px}
 .clave{font-size:15px}
 .acoes button{flex:1;padding:12px 10px}
 .slide img{width:100%}
}
</style>

<script id="dados" type="application/json">[{"id": "PAP24-2_1", "hoja": "2", "num": "1", "tp": "TP14", "stem": "¿Qué características son propias del esófago? Elija la opción correcta:", "opts": {"A": "está cubierto externamente por una túnica adventicia en toda su longitud.", "B": "está cubierto externamente por una túnica serosa en toda su longitud.", "C": "presenta una muscular de la mucosa gruesa con células musculares lisas orientadas circularmente.", "D": "presenta una muscular de la mucosa gruesa con células musculares lisas orientadas longitudinalmente.", "E": "la túnica muscular externa posee células musculares lisas en toda su longitud."}, "ans": "D", "clave": "La muscular de la mucosa del esófago es gruesa y de células musculares lisas dispuestas longitudinalmente a lo largo del tubo.", "nao": {"A": "La adventicia cubre solo la porción torácica del esófago; la porción intraabdominal tiene serosa.", "B": "La serosa cubre solo la porción intraabdominal; en la porción torácica la cubierta externa es adventicia.", "C": "La muscular de la mucosa es longitudinal; la disposición circunferencial corresponde a la capa interna de la muscular externa.", "E": "La muscular externa tiene músculo estriado en el tercio superior, estriado y liso en el medio y liso solo en el inferior."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-2_2", "hoja": "2", "num": "2", "tp": "TP15", "stem": "En el páncreas, las células centroacinares son estimuladas por:", "opts": {"A": "péptido inhibidor gástrico (GIP) y liberan bicarbonato y agua.", "B": "secretina y liberan bicarbonato y agua.", "C": "colecistoquinina y liberan proenzimas.", "D": "secretina y liberan proenzimas.", "E": "colecistoquinina y liberan bicarbonato y agua."}, "ans": "B", "clave": "Esta opción es correcta porque las células centroacinares, localizadas en los conductos intralobulillares del páncreas, responden a la estimulación por secretina secretando grandes cantidades de bicarbonato (HCO₃⁻) y agua hacia la luz ductal. Esta secreción alcalina neutraliza el quimo ácido proveniente del estómago en el duodeno, protegiendo la mucosa intestinal y optimizando la actividad de las enzimas pancreáticas.", "nao": {"C": "La colecistocinina estimula a las células acinosas, que liberan proenzimas; las centroacinares responden a la secretina.", "D": "La secretina estimula a las células de los conductos, que liberan bicarbonato y agua, no proenzimas.", "E": "Las centroacinares liberan bicarbonato y agua, pero responden a la secretina; la CCK actúa sobre las células acinosas.", "A": "El GIP (células K) estimula la liberación de insulina; las centroacinares responden a la secretina."}, "aviso": "", "slide": "Banco_de_Questoes - slides/23_Sistema_Digestivo_III_-_Glándulas_Anexas_p15.jpg"}, {"id": "PAP24-2_3", "hoja": "2", "num": "3", "tp": "TP14", "stem": "Las vellosidades intestinales son:", "opts": {"A": "proyecciones digitiformes, exclusivas de la mucosa del duodeno.", "B": "proyecciones digitiformes de la submucosa del intestino delgado.", "C": "proyecciones digitiformes exclusivas del yeyuno.", "D": "proyecciones digitiformes de la mucosa del intestino delgado.", "E": "proyecciones digitiformes exclusivas de la submucosa del íleon."}, "ans": "D", "clave": "Las vellosidades son evaginaciones digitiformes de la mucosa, con eje de lámina propia, presentes en todo el intestino delgado.", "nao": {"A": "Las vellosidades están en todo el intestino delgado (duodeno, yeyuno e íleon), no solo en el duodeno.", "B": "Son evaginaciones de la mucosa con eje de lámina propia; los pliegues permanentes de submucosa son las válvulas de Kerkring.", "C": "No son exclusivas del yeyuno: se encuentran en todo el intestino delgado.", "E": "Son de la mucosa, no de la submucosa, y están en todo el intestino delgado, no solo en el íleon."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-2_4", "hoja": "2", "num": "4", "tp": "TP17", "stem": "¿Cuál es la función de la paratohormona?:", "opts": {"A": "disminuir la absorción intestinal del calcio.", "B": "aumentar la excreción de calcio a nivel intestinal.", "C": "aumentar la actividad osteoclástica.", "D": "aumentar la excreción de calcio a nivel renal.", "E": "aumentar la actividad osteoblástica."}, "ans": "C", "clave": "La paratohormona es hipercalcemiante: aumenta la actividad osteoclástica y la absorción intestinal de calcio, e impide su pérdida renal.", "nao": {"A": "La PTH aumenta la absorción intestinal de calcio; no la disminuye, porque es hipercalcemiante.", "B": "La PTH aumenta la absorción intestinal de calcio; no aumenta su excreción intestinal.", "D": "La PTH impide la pérdida de calcio en el riñón (túbulo contorneado proximal); no aumenta su excreción renal.", "E": "La PTH aumenta la actividad osteoclástica, no la osteoblástica; la calcitonina es la que inhibe al osteoclasto y promueve el depósito de calcio en el hueso."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-2_5", "hoja": "2", "num": "5", "tp": "TP17", "stem": "Respecto de la configuración histológica de la pars nervosa de la glándula Hipófisis:", "opts": {"A": "una característica distintiva es la presencia de numerosas fibras mielínicas.", "B": "el parénquima es irrigado por capilares sinusoides.", "C": "los cuerpos de Herring son acúmulos de gránulos neurosecretores de oxitocina y hormona antidiurética.", "D": "los pituicitos son neuronas modificadas características de esta región de la hipófisis.", "E": "lo cuerpos de Herringlas se acumulan en los somas neuronales."}, "ans": "C", "clave": "Esta opción es correcta porque los cuerpos de Herring, también conocidos como cuerpos de Herring, son dilataciones axonales en los axones hipotalamo-hipofisarios de la pars nervosa (neurohipófisis), donde se acumulan gránulos neurosecretores que contienen las hormonas oxitocina y hormona antidiurética (ADH o vasopresina), las cuales son sintetizadas en los cuerpos celulares de los núcleos hipotalámicos supraóptico y paraventricular, respectivamente, y transportadas por los axones hasta su almacenamiento y liberación en la pars nervosa.", "nao": {"A": "La neurohipófisis tiene axones amielínicos, no mielínicos.", "B": "La pars nervosa tiene capilares fenestrados; los sinusoides irrigan los cordones de la adenohipófisis.", "D": "Los pituicitos son las células de sostén de la neurohipófisis, no neuronas modificadas.", "E": "Los cuerpos de Herring son dilataciones de los axones en la pars nervosa, no acúmulos en los somas neuronales."}, "aviso": "", "slide": "Banco_de_Questoes - slides/24_Sistema_endocrino_p08.jpg"}, {"id": "PAP24-2_6", "hoja": "2", "num": "6", "tp": "TP20", "stem": "¿Qué tipo de capilares y células de sostén se encuentran en el corpúsculo renal?:", "opts": {"A": "continuos y células mesangiales.", "B": "fenestrados y células mesangiales.", "C": "sinusoides y células mesangiales.", "D": "fenestrados y pericitos.", "E": "continuos y pericitos."}, "ans": "B", "clave": "El glomérulo es un ovillo de capilares con endotelio fenestrado, sostenido por células mesangiales que producen la matriz mesangial.", "nao": {"A": "Los capilares del glomérulo son fenestrados, no continuos; las fenestras dejan pasar ciertos componentes en la filtración.", "C": "Los capilares glomerulares son fenestrados, no sinusoides; las células de sostén sí son las mesangiales.", "D": "El sostén del glomérulo lo dan las células mesangiales; los pericitos son células perivasculares de capilares comunes.", "E": "Los capilares son fenestrados, no continuos, y las células de sostén son las mesangiales, no los pericitos."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-2_7", "hoja": "2", "num": "7", "tp": "TP18", "stem": "En el ovario, las células luteínicas de la granulosa del cuerpo lúteo o amarillo son:", "opts": {"A": "las de mayor tamaño y las más abundantes, sintetizan estrógenos, progesterona e inhibina.", "B": "las de mayor tamaño y las más abundantes, sintetizan estrógenos, progesterona y FSH.", "C": "las de mayor tamaño y las menos abundantes, sintetizan estrógenos, progesterona e inhibina.", "D": "las de menor tamaño y las más abundantes, sintetizan estrógenos, progesterona y testosterona.", "E": "las de mayor tamaño y abundante, sintetizan estrógenos, progesterona y proteína fijadora de andrógenos (ABP)."}, "ans": "A", "clave": "Las células granulosoluteínicas son las más grandes, centrales y abundantes del cuerpo lúteo y sintetizan progesterona, estrógenos e inhibina.", "nao": {"B": "La FSH la produce la hipófisis (células gonadotropas), no el cuerpo lúteo; las células luteínicas sintetizan sobre todo progesterona y estrógenos.", "C": "Las granulosoluteínicas son las más abundantes; las menos numerosas son las tecoluteínicas, periféricas, pequeñas y oscuras.", "D": "Las granulosoluteínicas son las de mayor tamaño y centrales; las de menor tamaño y periféricas son las tecoluteínicas.", "E": "La proteína fijadora de andrógenos (ABP) la secretan las células de Sertoli del testículo, no el cuerpo lúteo."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-2_8", "hoja": "2", "num": "8", "tp": "TP18/19", "stem": "La aromatasa es producida por las células de la:", "opts": {"A": "granulosa y por acción de la LH, cataliza la conversión de andrógenos producidos por la teca externa, en progesterona.", "B": "teca interna y por acción de la FSH, cataliza la conversión de andrógenos producidos por la teca externa, en estrógenos.", "C": "granulosa y por acción de la LH, cataliza la conversión de andrógenos producidos por la teca interna, en estrógenos.", "D": "granulosa y por acción de la FSH, cataliza la conversión de andrógenos producidos por la teca interna, en estrógenos.", "E": "granulosa y por acción de la FSH, cataliza la conversión de andrógenos producidos por la teca externa, en estrógenos."}, "ans": "D", "clave": "Esta alternativa es correcta porque describe con precisión el mecanismo de producción de aromatasa en el folículo ovárico. Las células de la granulosa, estimuladas por la FSH, sintetizan la enzima aromatasa, la cual cataliza la conversión de andrógenos (principalmente androstenediona) producidos por las células de la teca interna en estrógenos (como estradiol). Este proceso sigue la teoría de las dos células, esencial para la esteroidogénesis ovárica.", "nao": {"A": "La aromatasa convierte andrógenos de la teca interna en estrógenos, no en progesterona, y la granulosa responde a FSH, no a LH.", "B": "La teca interna carece de aromatasa; por eso produce sólo andrógenos y los transporta a la granulosa.", "C": "La granulosa responde a la FSH, no a la LH: la LH estimula a la teca interna para que secrete andrógenos.", "E": "Los andrógenos los produce la teca interna, no la externa, que es de tejido conectivo y músculo liso."}, "aviso": "", "slide": "Banco_de_Questoes - slides/26_-_Sistema_Reproductor_Femenino_p04.jpg"}, {"id": "PAP24-2_9", "hoja": "2", "num": "9", "tp": "TP18/19", "stem": "De las siguientes sustancias, ¿Cuál de ellas es sintetizada por la célula de Sertoli?", "opts": {"A": "tetraiodotiroglobulina.", "B": "inhibina.", "C": "dihidrotestosterona.", "D": "testosterona.", "E": "antígeno prostático específico (PSA)."}, "ans": "B", "clave": "Esta opción es correcta porque las células de Sertoli, ubicadas en los túbulos seminíferos de los testículos, sintetizan la inhibina, una glicoproteína que inhibe la secreción de la hormona folículo estimulante (FSH) por parte de las gonadotropas de la adenohipófisis, regulando así la espermatogénesis.", "nao": {"A": "La tiroglobulina es un producto tiroideo y no figura entre las secreciones de Sertoli (ABP, activador del plasminógeno, inhibina).", "C": "La dihidrotestosterona no figura entre las secreciones de Sertoli, que sintetizan ABP, activador del plasminógeno e inhibina.", "D": "La testosterona la secretan las células de Leydig, estimuladas por LH/ICSH.", "E": "El PSA es secreción de la próstata, no de la célula de Sertoli."}, "aviso": "", "slide": "Banco_de_Questoes - slides/28_Sistema_reproductor_masculino_p05.jpg"}, {"id": "PAP24-2_10", "hoja": "2", "num": "10", "tp": "TP22", "stem": "¿Cuál es la función de las células de Merkel ubicadas en la epidermis?", "opts": {"A": "mecanoreceptores de adaptación lenta.", "B": "presentadoras de antígenos de importancia en la defensa cutánea.", "C": "inmunidad mediada [?]r anticuerpos.", "D": "sintetizan un pigmento parduzco que le confiere color a la piel.", "E": "fagocitosis de complejos antígeno-anticuerpos."}, "ans": "A", "clave": "Esta opción es correcta porque las células de Merkel, localizadas en la capa basal de la epidermis, funcionan como mecanoreceptores de adaptación lenta. Estas células están asociadas a los discos táctiles y responden de manera sostenida a estímulos de presión y tacto continuo, transmitiendo información detallada sobre texturas, formas y presión prolongada a través de fibras nerviosas aferentes de tipo Aβ, contribuyendo a la discriminación táctil fina.", "nao": {"B": "Presentar antígenos en la epidermis es función de las células de Langerhans, ubicadas en el estrato espinoso.", "D": "El pigmento parduzco es la melanina, que sintetizan los melanocitos; la célula de Merkel es parte del mecanorreceptor.", "C": "La célula de Merkel es un mecanorreceptor; no participa en la inmunidad mediada por anticuerpos.", "E": "La célula de Merkel es un mecanorreceptor; la fagocitosis no es su función."}, "aviso": "", "slide": "Banco_de_Questoes - slides/32_Sistema_Tegumentario_p05.jpg"}, {"id": "PAP24-3_11", "hoja": "3", "num": "11", "tp": "TP16", "stem": "El septum transverso origina el:", "opts": {"A": "estroma hepático y las células hepatocíticas.", "B": "estroma hepático y las células no hepatocíticas.", "C": "parénquima hepático y las células hepatocíticas.", "D": "parénquima hepático y las células no hepatocíticas.", "E": "estroma y el parénquima del páncreas."}, "ans": "B", "clave": "El mesodermo del septum transverso origina el estroma hepático, las células hematopoyéticas, de Kupffer y de Ito, mientras los hepatocitos vienen del endodermo.", "nao": {"A": "Los hepatocitos son parénquima de origen endodérmico, del esbozo hepático; el septum transverso aporta el estroma, no los hepatocitos.", "C": "Los hepatocitos derivan del endodermo del esbozo hepático, no del mesodermo del septum transverso, que da el estroma.", "D": "El parénquima hepático son los hepatocitos (endodermo del esbozo hepático); el septum transverso forma estroma y células no hepatocíticas.", "E": "El páncreas se origina de esbozos endodérmicos del duodeno, no del septum transverso."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-3_12", "hoja": "3", "num": "12", "tp": "TP21", "stem": "El uréter deriva de el/los:", "opts": {"A": "pronefros.", "B": "brote o yema ureteral.", "C": "seno urogenital.", "D": "tubos pronéfricos.", "E": "metanefros."}, "ans": "B", "clave": "El uréter, junto con cálices y pelvis, deriva del brote ureteral, una evaginación del conducto mesonéfrico de Wolff.", "nao": {"A": "El pronefros es el primer sistema renal, cervical y sin función; desaparece y no deja nada, ni uréter.", "C": "El seno urogenital forma la vejiga y la uretra; el uréter viene del brote ureteral.", "D": "Los túbulos pronéfricos degeneran con el pronefros; la vía urinaria deriva del brote ureteral del conducto de Wolff.", "E": "El metanefros (blastema) origina las nefronas del riñón definitivo; el uréter lo forma el brote ureteral."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-3_13", "hoja": "3", "num": "13", "tp": "TP16", "stem": "En el estómago, luego de la rotación sobre su eje antero-posterior, la región pilórica se desplaza hacia la:", "opts": {"A": "izquierda y abajo.", "B": "izquierda y arriba.", "C": "derecha y abajo.", "D": "derecha y arriba.", "E": "izquierda."}, "ans": "D", "clave": "En la rotación anteroposterior del estómago la región pilórica, caudal, se desplaza hacia arriba y a la derecha.", "nao": {"A": "Izquierda y abajo es el sentido de la región cardial; la región pilórica sube y va hacia la derecha.", "B": "La región pilórica se desplaza a la derecha, no a la izquierda; izquierda y abajo corresponde al cardias.", "C": "Hacia abajo se desplaza la región cardial, a la izquierda; el píloro sube hacia la derecha.", "E": "El desplazamiento del píloro es hacia arriba y a la derecha; solo a la izquierda no es el sentido descrito."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-3_14", "hoja": "3", "num": "14", "tp": "TP21", "stem": "¿Qué generan los conductos paramesonéfricos de Müller?", "opts": {"A": "las vesículas seminales.", "B": "el epidídimo.", "C": "el conducto deferente", "D": "las trompas uterinas.", "E": "la vejiga."}, "ans": "D", "clave": "Los conductos paramesonéfricos de Müller forman las trompas uterinas (porciones cefálica y horizontal) y, al fusionarse, el conducto uterino.", "nao": {"A": "Las vesículas seminales provienen de una evaginación del conducto deferente, que es del conducto de Wolff.", "B": "El epidídimo deriva de los túbulos mesonéfricos, del conducto de Wolff, no del de Müller.", "C": "El conducto deferente se origina del conducto mesonéfrico de Wolff, no del paramesonéfrico de Müller.", "E": "La vejiga deriva de la porción superior dilatada del seno urogenital."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-3_15", "hoja": "3", "num": "15", "tp": "TP21", "stem": "El útero se forma a partir de:", "opts": {"A": "la porción vertical (cefálica) de los conductos de Müller.", "B": "la porción vertical (caudal) de los conductos de Müller.", "C": "la porción horizontal (media) de los conductos de Müller.", "D": "la porción cefálica de la lámina vaginal.", "E": "la porción caudal de la lámina vaginal."}, "ans": "B", "clave": "El útero se forma de las porciones verticales caudales de los conductos de Müller, fusionadas; la porción cefálica y la horizontal forman las trompas uterinas.", "nao": {"A": "La porción vertical cefálica forma, con la horizontal, la trompa uterina; no forma el útero.", "C": "La porción horizontal forma, con la cefálica, las trompas uterinas; no forma el útero.", "D": "La lámina vaginal se canaliza y forma la vagina, no el útero; el útero deriva de las porciones verticales caudales fusionadas de los conductos de Müller.", "E": "Ninguna porción de la lámina vaginal forma el útero: la lámina origina la vagina, y el útero sale de las porciones caudales fusionadas de Müller."}, "aviso": "", "slide": "Banco_de_Questoes - slides/31_Desarrollo_Genital_p07.jpg"}, {"id": "PAP24-3_16", "hoja": "3", "num": "16", "tp": "TP21", "stem": "Marque la aseveración correcta:", "opts": {"A": "el mesonefros es el primer esbozo renal en aparecer y ocupa la región cervical.", "B": "el pronefros es el primer esbozo renal en aparecer y ocupa la región cervical y lumbar.", "C": "el metanefros es el primer esbozo renal en aparecer y ocupa la región cervical.", "D": "el metanefros es el primer esbozo renal en aparecer y ocupa la región lumbar inferior.", "E": "el pronefros es el primer esbozo renal en aparecer y ocupa la región cervical."}, "ans": "E", "clave": "El pronefros es el primer sistema renal, se forma en la cuarta semana en la región cervical y no tiene función.", "nao": {"A": "El primer esbozo en aparecer es el pronefros, cervical; el mesonefros es el segundo y ocupa la región toracolumbar.", "B": "El pronefros es el primero, pero ocupa solo la región cervical, no la lumbar.", "C": "El metanefros es el último en aparecer y ocupa la región lumbar baja y sacra, no la cervical.", "D": "El metanefros es el último esbozo renal, no el primero; ocupa la región lumbar baja y sacra."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-3_17", "hoja": "3", "num": "17", "tp": "TP21", "stem": "El uraco deriva de/del:", "opts": {"A": "Seno urogenital.", "B": "Intestino medio.", "C": "Metanefros.", "D": "Septum Transverso.", "E": "Mesodermo paraaxial."}, "ans": "A", "clave": "El uraco es el cordón fibroso remanente del alantoides que une el ápice de la vejiga, derivada del seno urogenital, con el cordón umbilical.", "nao": {"B": "El intestino medio se comunica con el saco vitelino por el conducto vitelino; el uraco es remanente del alantoides unido a la vejiga.", "C": "El metanefros forma el riñón definitivo (nefronas); el uraco conecta el vértice de la vejiga con el ombligo.", "D": "El septum transverso es mesodermo que aporta estroma al hígado; no interviene en el aparato urinario.", "E": "El mesodermo paraaxial forma somitas y somitómeras; el uraco procede del alantoides, unido al seno urogenital."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-3_18", "hoja": "3", "num": "18", "tp": "TP21", "stem": "La vagina es de origen:", "opts": {"A": "solo endodérmico.", "B": "endodérmico y mesodérmico.", "C": "solo mesodérmico.", "D": "mesodérmico y ectodérmico.", "E": "solo ectodérmico."}, "ans": "B", "clave": "La vagina tiene doble origen: la región superior deriva del conducto uterino (Müller) y la inferior del seno urogenital.", "nao": {"A": "La región superior de la vagina deriva del conducto uterino (Müller, mesodermo), por eso no es solo endodérmica.", "C": "La región inferior de la vagina deriva del seno urogenital, por eso no es solo mesodérmica.", "D": "Las dos porciones de la vagina vienen del conducto uterino y del seno urogenital; ninguna es de origen ectodérmico.", "E": "La vagina tiene doble origen, conducto uterino y seno urogenital; no deriva solo del ectodermo."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-3_19", "hoja": "3", "num": "19", "tp": "TP21", "stem": "Las nefronas renales se originan a partir de:", "opts": {"A": "conductos mesonéfricos de Wolff.", "B": "blastemas metanéfricos.", "C": "brote ueteral.", "D": "seno urogenital.", "E": "conductos paramesonéfricos de Muller."}, "ans": "B", "clave": "Las nefronas derivan del blastema metanéfrico, inducido por el brote ureteral; el brote forma la vía excretora (túbulos colectores, cálices, pelvis y uréter).", "nao": {"D": "El seno urogenital origina la vejiga y la uretra.", "A": "El conducto de Wolff aporta el brote ureteral (vía excretora); las nefronas derivan del blastema metanéfrico.", "C": "El brote ureteral origina túbulos colectores, cálices, pelvis renal y uréter, no las nefronas.", "E": "Los conductos de Müller forman trompas, útero y parte superior de la vagina, no nefronas."}, "aviso": "", "slide": "Banco_de_Questoes - slides/30_Desarrollo_del_sistema_urinario_p07.jpg"}, {"id": "PAP24-3_20", "hoja": "3", "num": "20", "tp": "TP16", "stem": "La glándula tiroides se forma a partir del:", "opts": {"A": "ectodermo del suelo del estomodeo.", "B": "ectodermo del techo del estomodeo.", "C": "endodermo del suelo de la faringe.", "D": "endodermo del techo de la faringe.", "E": "endodermo de la primera bolsa faríngea."}, "ans": "C", "clave": "La tiroides deriva del endodermo y se origina en el piso de la faringe, a la altura del foramen ciego.", "nao": {"A": "La tiroides deriva del endodermo, no del ectodermo; el ectodermo del estomodeo forma la bolsa de Rathke.", "B": "El ectodermo del techo del estomodeo da la bolsa de Rathke (adenohipófisis); la tiroides es endodérmica.", "D": "La tiroides se origina en el piso de la faringe, no en el techo.", "E": "La primera bolsa faríngea forma la caja del tímpano y la trompa de Eustaquio, no la tiroides."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_1", "hoja": "4", "num": "1", "tp": "TP20", "stem": "En la corteza renal se encuentran estas partes del nefrón:", "opts": {"A": "cápsula de Bowman, asa de Henle y túbulos colectores.", "B": "exclusivamente corpúsculos renales y túbulo contorneado proximal.", "C": "corpúsculos renales, porciones contorneadas de túbulo distal y proximal.", "D": "corpúsculos renales, segmento delgado del asa de Henle y tubos de Bellini.", "E": "glomérulos y porciones gruesas y delgadas del asa de Henle."}, "ans": "C", "clave": "La corteza renal contiene corpúsculos renales y las porciones contorneadas de los túbulos proximal y distal, en los laberintos corticales.", "nao": {"A": "El túbulo colector no es parte del nefrón, y el asa de Henle de la corteza está solo en los rayos medulares, no en los laberintos corticales.", "B": "En la corteza también están las porciones contorneadas del túbulo distal, no solo el contorneado proximal.", "D": "El segmento delgado del asa de Henle y los conductos colectores corresponden a la médula, no a los laberintos corticales.", "E": "Las porciones delgadas del asa de Henle están en la médula, no en la corteza; los laberintos corticales tienen corpúsculos y túbulos contorneados."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_2", "hoja": "4", "num": "2", "tp": "TP18", "stem": "La capa funcional del endometrio:", "opts": {"A": "no presenta modificaciones cíclicas y es eliminada parcialmente durante la fase menstrual.", "B": "presenta modificaciones cíclicas y es eliminada totalmente durante la fase menstrual.", "C": "presenta modificaciones cíclicas y es eliminada parcialmente durante la fase menstrual.", "D": "no presenta modificaciones cíclicas y es eliminada totalmente durante la fase menstrual.", "E": "no presenta modificaciones cíclicas y no es eliminada durante la fase menstrual."}, "ans": "B", "clave": "La capa funcional del endometrio responde cíclicamente a las hormonas y se desprende por completo en la menstruación.", "nao": {"A": "La capa funcional sí presenta modificaciones cíclicas: es la única que responde a las hormonas del ciclo.", "C": "La capa funcional se elimina por completo en la menstruación; la que queda es la capa basal.", "D": "La capa funcional sí tiene cambios cíclicos; es la que se desprende y se regenera en la fase proliferativa.", "E": "La capa funcional se desprende en la fase menstrual; sí presenta cambios cíclicos y sí es eliminada."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_3", "hoja": "4", "num": "3", "tp": "TP15", "stem": "En el espacio perisinusoidal o de Disse se encuentra/n:", "opts": {"A": "elementos formes de la sangre y se considera el final de la circulación linfática.", "B": "plasma sanguíneo y se considera el comienzo de la circulación linfática.", "C": "bilis y se considera el comienzo de la circulación biliar.", "D": "bilis y se lo considera el final de la circulación biliar.", "E": "elementos formes de la sangre y se considera el comienzo de la circulación sanguínea."}, "ans": "B", "clave": "El espacio de Disse, entre endotelio sinusoidal y hepatocitos, contiene plasma y es donde se origina la linfa hepática.", "nao": {"A": "El espacio de Disse contiene plasma, no elementos formes, y es el comienzo de la circulación linfática, no el final.", "C": "La bilis circula en los canalículos biliares entre hepatocitos; el espacio de Disse está entre endotelio sinusoidal y hepatocitos.", "D": "La bilis no está en el espacio de Disse sino en los canalículos biliares, que son el comienzo de la vía biliar.", "E": "La sangre circula por el sinusoide; el espacio de Disse queda por fuera del endotelio y es el origen de la linfa."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_4", "hoja": "4", "num": "4", "tp": "TP14", "stem": "Respecto a la glándula parótida, señale la opción correcta:", "opts": {"A": "es la glándula salival de mayor tamaño y es mucosa pura.", "B": "es serosa pura pero carece de conducto excretor mayor.", "C": "es serosa pura y es la mayor de las glándulas salivales.", "D": "es mixta mucoserosa y su conducto principal desemboca en el piso de la boca.", "E": "es mixta seromucosa y su conducto principal desemboca en la carúncula sublingual."}, "ans": "C", "clave": "La parótida es la glándula salival de mayor tamaño, serosa pura, y su conducto principal es el de Stenon.", "nao": {"A": "La parótida es la mayor, pero es serosa pura; la glándula de moco predominante es la sublingual.", "B": "La parótida es serosa pura y sí tiene conducto excretor mayor: el conducto de Stenon.", "D": "La parótida es serosa, no mixta, y su conducto de Stenon desemboca en el vestíbulo bucal, no en el piso de la boca.", "E": "La parótida es serosa pura y su conducto de Stenon desemboca en el vestíbulo bucal; la seromucosa, con conducto de Wharton en el piso de la boca, es la submaxilar."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_5", "hoja": "4", "num": "5", "tp": "TP19", "stem": "Las células del túbulo seminífero que contactan con la lámina basal son:", "opts": {"A": "Sertoli y espermatocitos primarios.", "B": "Sertoli y espemátides.", "C": "Sertoli y espermatocitos secundarios.", "D": "Sertoli y espermatogonias.", "E": "espermatocitos primarios y espermatogonias."}, "ans": "D", "clave": "Las células de Sertoli y las espermatogonias, las más inmaduras, contactan con la lámina basal en el compartimento basal del túbulo seminífero.", "nao": {"A": "Las células espermatogénicas apoyadas sobre la lámina basal son las espermatogonias; los espermatocitos primarios avanzan hacia el compartimento adluminal.", "B": "Las espermátides ocupan el compartimento adluminal, por encima de las uniones entre células de Sertoli, lejos de la lámina basal.", "C": "Los espermatocitos secundarios están en el compartimento adluminal, no apoyados en la lámina basal.", "E": "Falta la célula de Sertoli, que se extiende desde la lámina basal hasta la luz del túbulo; los espermatocitos primarios avanzados son adluminales."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_6", "hoja": "4", "num": "6", "tp": "TP18", "stem": "Un folículo ovárico secundario o antral posee una cavidad ubicada:", "opts": {"A": "entre el ovocito y la membrana pelúcida.", "B": "entre las células de la granulosa y la teca interna.", "C": "entre las células de la granulosa y la teca externa.", "D": "dentro de la capa de células de la granulosa.", "E": "dentro de la teca interna."}, "ans": "D", "clave": "El antro folicular es una cavidad con líquido que aparece entre las células de la granulosa del folículo secundario o antral.", "nao": {"A": "El antro es líquido entre las células de la granulosa; no queda entre el ovocito y la zona pelúcida.", "B": "El antro está dentro de la granulosa, no entre ella y la teca interna, que es una capa externa organizada alrededor.", "C": "La cavidad antral aparece entre las células de la granulosa; la teca externa rodea el folículo por fuera.", "E": "La teca interna es una capa de células con capilares; el antro se forma entre las células de la granulosa."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_7", "hoja": "4", "num": "7", "tp": "TP14", "stem": "Las estructuras, que aumentan la superficie de absorción en el intestino delgado son:", "opts": {"A": "cilias y vellosidades.", "B": "válvulas de Kerkring, vellosidades y microvellosidades.", "C": "válvulas conniventes, cilias y microvellosidades.", "D": "válvulas conniventes, cilias y vellosidades.", "E": "válvulas conniventes, criptas y estereocilios."}, "ans": "B", "clave": "El intestino delgado aumenta la superficie de absorción con válvulas de Kerkring (pliegues circulares), vellosidades y microvellosidades.", "nao": {"A": "El enterocito absorbe por sus microvellosidades (chapa estriada); además de vellosidades, el delgado tiene pliegues circulares, no cilias.", "C": "Entre las estructuras de absorción no figuran cilias: son válvulas de Kerkring, vellosidades y microvellosidades.", "D": "Las cilias no aumentan la superficie de absorción; faltan las microvellosidades de la chapa estriada.", "E": "Las criptas de Lieberkühn son glándulas tubulares simples; no son estructuras de absorción, y el delgado no tiene estereocilios."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_8", "hoja": "4", "num": "8", "tp": "TP18", "stem": "El exocervix posee un epitelio:", "opts": {"A": "plano simple.", "B": "plano estratificado no queratinizado.", "C": "cúbico simple.", "D": "cúbico estratificado queratinizado.", "E": "mesotelio."}, "ans": "B", "clave": "El exocérvix, la porción del cuello que se proyecta en la vagina, tiene epitelio plano estratificado como el de la vagina.", "nao": {"A": "El exocérvix tiene epitelio plano estratificado, no simple; el epitelio simple (cilíndrico) corresponde al endocérvix.", "C": "El exocérvix tiene epitelio plano estratificado; el cúbico simple no lo reviste, y el endocérvix es cilíndrico simple.", "D": "El exocérvix tiene epitelio plano estratificado, con capas basal, espinosas y superficial de células poligonales, no cúbico estratificado.", "E": "El mesotelio, cúbico, reviste la superficie del ovario, no el exocérvix."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_9", "hoja": "4", "num": "9", "tp": "TP17", "stem": "¿Cuál de las siguientes es una célula acidófila de la adenohipófisis?", "opts": {"A": "tirotropa.", "B": "somatotropa.", "C": "adrenocorticotropa.", "D": "gonadotropa.", "E": "foliculoestelares."}, "ans": "B", "clave": "Las células acidófilas de la adenohipófisis son las somatotropas, que producen hormona del crecimiento, y las lactotropas.", "nao": {"A": "Las tirotropas son basófilas, no acidófilas; producen TSH.", "C": "Las corticotropas son basófilas, no acidófilas; producen ACTH.", "D": "Las gonadotropas son basófilas, no acidófilas; producen FSH y LH.", "E": "Las células foliculoestelares no sintetizan hormonas; forman una red interconectada que transmite señales, y no figuran entre las acidófilas, que son somatotropas y lactotropas."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-4_10", "hoja": "4", "num": "10", "tp": "TP17", "stem": "En la glándula tiroides, la yodación de la tiroglobulina se produce en:", "opts": {"A": "el citoplasma de la célula folicular.", "B": "la célula parafolicular.", "C": "la célula C.", "D": "el coloide a la altura de las microvellosidades", "E": "en el RER de la célula folicular."}, "ans": "D", "clave": "La tiroglobulina se yoda en el coloide, donde el yodo se une a sus tirosinas y forma MIT y DIT.", "nao": {"A": "La yodación ocurre en el coloide, no en el citoplasma: la célula folicular capta yodo y sintetiza la tiroglobulina.", "B": "Las células parafoliculares secretan calcitonina; no participan en la yodación de la tiroglobulina.", "C": "Las células C (parafoliculares) secretan calcitonina; la yodación se hace sobre la tiroglobulina en el coloide.", "E": "En el RER solo se sintetiza la tiroglobulina; el yodo se une a sus tirosinas ya en el coloide."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-5_11", "hoja": "5", "num": "11", "tp": "TP16", "stem": "[?]urante la semana 16 a 26 del desarrollo pulmonar. ¿A qué período hacemos referencia y qué estructuras lo caracterizan?:", "opts": {"A": "[?]eríodo canalicular y se caracteriza porque los bronquiolos se dividen continuamente y hay incremento de la vascularización.", "B": "período [?]icular y se caracteriza porque los bronquiolos se dividen continuamente y hay diferenciación de neumocitos tipo II con síntesis de surfactante.", "C": "período pseudoglandular y se caracteriza porque los bronquiolos se dividen continuamente y hay incremento de la vascularización.", "D": "período alveolar y se caracteriza porque los bronquiolos se dividen continuamente y hay incremento de la vascularización.", "E": "período canalicular y se caracteriza porque los bronquiolos se dividen continuamente y hay diferenciación de neumocitos tipo I con síntesis de surfactante."}, "ans": "A", "clave": "De la semana 16 a la 26 es el período canalicular: los bronquiolos se siguen dividiendo y la irrigación vascular aumenta.", "nao": {"B": "Los neumocitos tipo II con surfactante aparecen hacia el final del sexto mes, ya en el período de sacos terminales (desde la semana 26).", "C": "El período pseudoglandular va de la semana 5 a la 16; de la 16 a la 26 es el canalicular.", "D": "El período alveolar comienza con el nacimiento y sigue hasta la infancia; la semana 16 a 26 es canalicular.", "E": "Los neumocitos tipo I son planos y forman la barrera hematoaérea; el surfactante lo sintetizan los tipo II."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-5_12", "hoja": "5", "num": "12", "tp": "TP16", "stem": "¿Cuáles de estos enunciados es verdadero con respecto a los derivados de las bolsas faríngeas?", "opts": {"A": "Primera bolsa faríngea: primordio de la amígdala palatina.", "B": "Segunda bolsa faríngea: células C de la glándula tiroides", "C": "Segunda bolsa [?]ríngea: timo.", "D": "Segunda bolsa faríngea: glándulas paratiroides inferior.", "E": "Primera bolsa faríngea: caja del tímpano y trompa de [E]ustaquio."}, "ans": "E", "clave": "La primera bolsa faríngea origina, en su porción distal, la caja del tímpano y, en la proximal, la trompa de Eustaquio.", "nao": {"A": "La amígdala palatina deriva de la segunda bolsa faríngea; la primera forma caja del tímpano y trompa de Eustaquio.", "B": "Las células C derivan de la quinta bolsa (cuerpo último branquial), con células de las crestas neurales, no de la segunda.", "C": "El timo deriva del ala ventral de la tercera bolsa faríngea; la segunda forma la amígdala palatina.", "D": "Las paratiroides inferiores derivan del ala dorsal de la tercera bolsa; la segunda forma la amígdala palatina."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-5_13", "hoja": "5", "num": "13", "tp": "TP16", "stem": "Si hablamos del desarrollo del páncreas ¿Cuál es la opción correcta?", "opts": {"A": "Aparece como dos primordios (dorsal y ventral) dentro del mesodermo del duodeno.", "B": "El páncreas dorsal forma la mayor parte de la glándula y el conducto de Wirsung.", "C": "Su desarrollo es independiente de la expresión de SHH.", "D": "El primordio dorsal es mucho más pequeño que el primordio ventral.", "E": "El factor de transcripción Pdx-1 interrumpe el desarrollo de la yema pancreática."}, "ans": "B", "clave": "El esbozo pancreático dorsal, el mayor, forma la mayor parte de la glándula y con el conducto ventral origina el conducto de Wirsung.", "nao": {"A": "Los dos primordios se originan del revestimiento endodérmico del duodeno, no del mesodermo.", "C": "El páncreas requiere que el FGF y la activina de la notocorda inhiban el SHH en el endodermo pancreático, que entonces expresa PDX-1.", "D": "El primordio dorsal es el de mayor tamaño; el ventral es el más pequeño.", "E": "PDX-1 es un gen maestro que activa la diferenciación pancreática; no interrumpe el desarrollo de la yema."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-5_14", "hoja": "5", "num": "14", "tp": "TP16", "stem": "Durante su desarrollo embriológico, ¿cómo rota el estómago?:", "opts": {"A": "90º en sentido horario sobre su eje longitudinal.", "B": "90º en sentido horario sobre sus ejes longitudinal y transversal.", "C": "90º en sentido antihorario sobre su eje transversal.", "D": "90º en sentido horario sobre su eje transversal.", "E": "90º en sentido antihorario sobre su eje longitudinal."}, "ans": "A", "clave": "El estómago rota 90 grados en sentido horario sobre su eje longitudinal, y la cara izquierda pasa a ser ventral.", "nao": {"B": "La segunda rotación es anteroposterior, no transversal; la longitudinal de 90 grados horaria es la otra.", "C": "El sentido es horario, no antihorario, y el eje de la rotación de 90 grados es el longitudinal.", "D": "La rotación horaria de 90 grados es sobre el eje longitudinal; la otra rotación del estómago es sobre el eje anteroposterior, no sobre el transversal.", "E": "La rotación longitudinal es en sentido horario, no antihorario: la cara izquierda pasa a ser ventral."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-5_15", "hoja": "5", "num": "15", "tp": "TP21", "stem": "El túbulo colector del riñón se desarrolla embriológicamente a partir del:", "opts": {"A": "brote ureteral e induce al blastema metanéfrico a formar la caperuza y vesícula renal que van a formar la nefrona.", "B": "brote ureteral e induce al blastema mesonéfrico a formar la caperuza y vesícula renal que van a formar la nefrona.", "C": "brote ureteral e induce al blastema mesonéfrico a formar la caperuza y vesícula renal que van a formar el túbulo urinífero.", "D": "brote uretral e induce al mesodermo intermedio a formar la vejiga.", "E": "brote uretral e induce al blastema mesonéfrico a diferenciarse en cresta gonadal."}, "ans": "A", "clave": "Respuesta según la clave del simulacro @apuntes.medunlp (no oficial).", "nao": {"B": "El brote ureteral induce al blastema metanéfrico, no al mesonéfrico.", "C": "El brote ureteral induce al blastema metanéfrico, no al mesonéfrico; caperuza y vesícula renal forman la nefrona, no el túbulo urinífero completo.", "D": "El brote es ureteral, no «uretral», e induce al blastema metanéfrico; la vejiga viene del seno urogenital.", "E": "El brote es ureteral, no «uretral», e induce al blastema metanéfrico a formar la nefrona, no la cresta gonadal."}, "aviso": "Clave del simulacro, no oficial", "slide": "Banco_de_Questoes - slides/30_Desarrollo_del_sistema_urinario_p06.jpg"}, {"id": "PAP24-5_16", "hoja": "5", "num": "16", "tp": "TP21", "stem": "Del seno urogenital deriva:", "opts": {"A": "el uréter.", "B": "la vejiga.", "C": "el conjunto de cálices mayores.", "D": "el conjunto de cálices menores.", "E": "la cápsula de Bowman."}, "ans": "B", "clave": "La porción superior dilatada del seno urogenital origina la vejiga; la porción caudal origina la uretra.", "nao": {"A": "El uréter deriva del brote ureteral del conducto mesonéfrico de Wolff, no del seno urogenital.", "C": "Los cálices mayores derivan del brote ureteral, no del seno urogenital.", "D": "Los cálices menores derivan del brote ureteral, no del seno urogenital.", "E": "La cápsula de Bowman pertenece a la nefrona y deriva del blastema metanéfrico, no del seno urogenital."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-5_17", "hoja": "5", "num": "17", "tp": "TP21", "stem": "En los cordones testiculares de la gónada masculina en desarrollo, ¿qué tipos celulares podemos reconocer?:", "opts": {"A": "células germinales primitivas y células de Sertoli que producen hormona antimulleriana.", "B": "espermátides y células de Sertoli que se diferencian a partir de la sexta semana y producen hormona antimulleriana.", "C": "espermatocitos y células de Sertoli que se diferencian a partir de la octava semana y producen hormona antimulleriana.", "D": "espermátides y células de Sertoli que se diferencian a partir de la octava semana y producen hormona antimulleriana.", "E": "espermatogonias y células de Leydig que se diferencian a partir de la sexta semana y producen hormona antimulleriana"}, "ans": "A", "clave": "Esta opción es correcta porque en los cordones testiculares de la gónada masculina en desarrollo se encuentran células germinales primitivas, también conocidas como gonocitos o células germinales primordiales, y células de Sertoli. Estas últimas se diferencian tempranamente bajo la influencia del gen SRY y producen la hormona antimülleriana (HAM), que induce la regresión de los conductos de Müller, permitiendo el desarrollo del sistema genital masculino.", "nao": {"B": "Las espermátides son un estadio tardío de la espermatogénesis; en los cordones hay células germinales primitivas y células de Sertoli.", "C": "Los espermatocitos todavía no están en los cordones testiculares, que contienen células germinales primitivas y células de Sertoli.", "D": "Las espermátides no están en los cordones testiculares, que contienen células germinales primitivas y células de Sertoli.", "E": "Las células de Leydig están entre los cordones, no en ellos, y la hormona antimülleriana la secretan las de Sertoli; tampoco hay espermatogonias todavía."}, "aviso": "", "slide": "Banco_de_Questoes - slides/31_Desarrollo_Genital_p05.jpg"}, {"id": "PAP24-5_18", "hoja": "5", "num": "18", "tp": "TP21", "stem": "El conducto de Wolff, dará a origen a cuáles de las siguientes estructuras:", "opts": {"A": "cordones testiculares, epidídimo, conducto deferente, vesículas seminales y conducto eyaculador.", "B": "epidídimo, conducto deferente, vesículas seminales y conducto eyaculador.", "C": "conos eferentes, epidídimo, conducto deferente, vesículas seminales y conducto eyaculador.", "D": "epéndimo, conducto deferente, vesículas seminales y conducto eyaculador.", "E": "epidídimo, conos eferentes, vesículas seminales y conducto eyaculador"}, "ans": "B", "clave": "Esta opción es correcta porque el conducto de Wolff, o conducto mesonéfrico, en el embrión masculino bajo la influencia de la testosterona secretada por las células de Leydig, persiste y se diferencia en las estructuras del sistema reproductor masculino: epidídimo, conducto deferente, vesículas seminales y conducto eyaculador. Estas derivan directamente de la porción craneal, media y caudal del conducto mesonéfrico, respectivamente, mientras que en hembras se atrofia en ausencia de hormonas androgénicas.", "nao": {"D": "El epéndimo es el epitelio que reviste las cavidades del encéfalo y la médula (neuroectodermo); del conducto de Wolff deriva el epidídimo.", "A": "Los cordones testiculares derivan de los cordones sexuales primitivos (epitelio celómico), no del conducto de Wolff.", "C": "Los conos (conductillos) eferentes derivan de los túbulos mesonéfricos que contactan con la rete testis, no del conducto de Wolff.", "E": "Falta el conducto deferente y sobran los conos eferentes, que derivan de los túbulos mesonéfricos y no del conducto de Wolff."}, "aviso": "", "slide": "Banco_de_Questoes - slides/31_Desarrollo_Genital_p06.jpg"}, {"id": "PAP24-5_19", "hoja": "5", "num": "19", "tp": "TP21", "stem": "En la 5° semana de desarrollo las células germinales migran a través del:", "opts": {"A": "saco vitelino, mesenterio dorsal, intestino posterior.", "B": "saco vitelino, metanefros, conducto de Wolff.", "C": "conducto vitelino, alantoides, mesonefros.", "D": "saco vitelino, intestino posterior, mesonefros.", "E": "conducto vitelino, mesenterio dorsal, cresta gonadal."}, "ans": "A", "clave": "Las células germinales primordiales migran desde la pared del saco vitelino a lo largo del intestino posterior y el mesenterio dorsal hasta la cresta genital.", "nao": {"B": "Las células germinales no migran por metanefros ni conducto de Wolff: van por la pared del intestino posterior y el mesenterio dorsal.", "C": "La ruta no incluye conducto vitelino ni alantoides ni mesonefros; parten de la pared del saco vitelino por el mesenterio dorsal.", "D": "El mesonefros no es parte de la ruta: la cresta genital queda junto a él y es el destino de las células.", "E": "Las células salen de la pared del saco vitelino, no del conducto vitelino, y la cresta gonadal es el destino, no un tramo del camino."}, "aviso": "Clave no oficial (clase/Ross)", "slide": ""}, {"id": "PAP24-5_20", "hoja": "5", "num": "20", "tp": "TP21", "stem": "En el desarrollo de los genitales externos femeninos, del tubérculo genital deriva:", "opts": {"A": "los labios mayores.", "B": "los labios menores.", "C": "el vestíbulo vulvar.", "D": "el clítoris.", "E": "la vagina."}, "ans": "D", "clave": "En la mujer, el tubérculo genital origina solo el clítoris; los pliegues urogenitales forman los labios menores y los rodetes genitales, los labios mayores.", "nao": {"A": "Los labios mayores derivan de los rodetes genitales, no del tubérculo genital.", "B": "Los labios menores derivan de los pliegues urogenitales, no del tubérculo genital.", "C": "El vestíbulo viene del surco urogenital que queda abierto, no del tubérculo genital.", "E": "La vagina viene de los conductos de Müller y del seno urogenital, no del tubérculo genital."}, "aviso": "", "slide": "Banco_de_Questoes - slides/31_Desarrollo_Genital_p09.jpg"}]</script>
<script>
const QS=JSON.parse(document.getElementById('dados').textContent);
const CH='parcial2024_papel_v1';
let est={modo:'prueba',hoja:'todas',soloErr:false,res:{},risc:{},bloco:null};
try{const s=JSON.parse(localStorage.getItem(CH)||'{}')||{};
  if(s.modo==='estudiar'||s.modo==='prueba')est.modo=s.modo;
  if(typeof s.hoja==='string'&&(s.hoja==='todas'||QS.some(q=>q.hoja===s.hoja)))est.hoja=s.hoja;
  est.soloErr=s.soloErr===true;
  if(s.res&&typeof s.res==='object'&&!Array.isArray(s.res))est.res=s.res;
  if(s.risc&&typeof s.risc==='object'&&!Array.isArray(s.risc))for(const k in s.risc)if(Array.isArray(s.risc[k]))est.risc[k]=s.risc[k];
  if(s.bloco&&Array.isArray(s.bloco.ids)&&s.bloco.ids.some(i=>QS.some(q=>q.id===i)))est.bloco=s.bloco;
}catch(e){}
const guardar=()=>{try{localStorage.setItem(CH,JSON.stringify(est))}catch(e){}};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

function filtros(){
  const f=document.getElementById('filtros');f.innerHTML='';
  const hojas=['todas',...new Set(QS.map(q=>q.hoja))];
  hojas.forEach(h=>{const b=el('button',est.hoja===h?'on':'',h==='todas'?'Todas las hojas':'Hoja '+h);
    b.onclick=()=>{est.hoja=h;est.bloco=null;guardar();render()};f.appendChild(b)});
  const e=el('button',est.soloErr?'on':'','Solo las que erré');
  e.onclick=()=>{est.soloErr=!est.soloErr;guardar();render()};f.appendChild(e);
  const errIds=(est.bloco?est.bloco.ids.map(i=>QS.find(q=>q.id===i)):QS).filter(q=>q&&est.res[q.id]!=null&&est.res[q.id]!==q.ans).map(q=>q.id);
  if(errIds.length){const b=el('button','bloco-btn','Rehacer solo las erradas ('+errIds.length+')');
    b.onclick=()=>{const antes={};errIds.forEach(i=>{antes[i]=est.res[i];delete est.res[i];delete est.risc[i]});
      est.bloco={ids:errIds,antes};est.modo='prueba';est.soloErr=false;guardar();render();scrollTo(0,0)};f.appendChild(b)}
  if(est.bloco){const s=el('button','','Salir del bloque');s.onclick=()=>{est.bloco=null;guardar();render()};f.appendChild(s)}
  const r=el('button','','Reiniciar respuestas');
  r.onclick=()=>{est.res={};est.risc={};est.bloco=null;guardar();render()};f.appendChild(r);
  document.querySelectorAll('#modos button').forEach(b=>{b.classList.toggle('on',b.dataset.m===est.modo);
    b.onclick=()=>{est.modo=b.dataset.m;guardar();render()}});
}

function tarjeta(q){
  const c=el('div','q');
  const cab=el('div','cab');
  cab.appendChild(el('span','selo','Hoja '+q.hoja+' · '+q.num));
  cab.appendChild(el('span','selo',q.tp));
  if(q.aviso) cab.appendChild(el('span','selo warn',q.aviso));
  c.appendChild(cab);
  c.appendChild(el('div','stem',q.stem));
  const resp=est.res[q.id];
  const mostrar=est.modo==='estudiar'||resp!=null;
  Object.keys(q.opts).sort().forEach(k=>{
    const b=el('button','op');
    b.appendChild(el('b','',k+')'));b.appendChild(document.createTextNode(q.opts[k]));
    if(mostrar){
      if(k===q.ans) b.classList.add('ok');
      else if(est.modo==='estudiar'||k===resp) b.classList.add('no');
      if(k!==q.ans&&q.nao[k]&&(est.modo==='estudiar'||k===resp||resp!=null)) b.appendChild(el('span','nota',q.nao[k]));
    }
    if(!mostrar) b.onclick=()=>{est.res[q.id]=k;guardar();render()};
    const rq=est.risc[q.id]||[];
    if(rq.includes(k)) b.classList.add('riscada');
    const x=el('button','risca'+(rq.includes(k)?' on':''),'✕');
    x.title='Tachar la opción '+k;x.setAttribute('aria-label','Tachar la opción '+k);
    x.onclick=()=>{const l=est.risc[q.id]||[];const i=l.indexOf(k);
      if(i<0)l.push(k);else l.splice(i,1);
      if(l.length)est.risc[q.id]=l;else delete est.risc[q.id];guardar();render()};
    const lin=el('div','linha');lin.appendChild(b);lin.appendChild(x);
    c.appendChild(lin);
  });
  if(mostrar){
    c.appendChild(el('div','clave','Clave: '+q.clave));
    const a=el('div','acoes');
    if(q.slide){const s=el('button','','Ver slide');s.onclick=()=>{
      const box=c.querySelector('.slide');if(box){box.remove();return}
      const d=el('div','slide');const i=new Image();i.loading='lazy';i.src=q.slide;i.alt='Slide de la clase';d.appendChild(i);c.appendChild(d)};a.appendChild(s)}
    if(est.modo==='prueba'&&resp!=null){const r=el('button','','Responder de nuevo');r.onclick=()=>{delete est.res[q.id];delete est.risc[q.id];guardar();render()};a.appendChild(r)}
    if(a.children.length)c.appendChild(a);
  }

}

function render(){

  const L=document.getElementById('lista');L.innerHTML='';
  let qs;

    if(est.soloErr) qs=qs.filter(q=>est.res[q.id]!=null&&est.res[q.id]!==q.ans);

}
try{render()}catch(e){est={modo:'prueba',hoja:'todas',soloErr:false,res:{},risc:{},bloco:null};guardar();render()}
